<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Feedback Desk · AI 用户反馈分析台 / AI feedback workspace">
  <title>Feedback Desk</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" id="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Feedback<span class="brand-second">Desk</span><small data-copy="tagline"></small></span></a>
      <div class="workspace-card"><span class="workspace-icon" id="workspace-icon" aria-hidden="true">P</span><span><strong id="workspace-name">PowerToys</strong><small id="workspace-kind"></small></span></div>
      <div class="nav-label" data-copy="workspace"></div>
      <nav>
        <a href="#overview" data-page="overview"><span class="icon grid-icon" aria-hidden="true"></span><span data-copy="overview"></span></a>
        <a href="#review" data-page="review"><span class="icon inbox" aria-hidden="true"></span><span data-copy="review"></span></a>
        <a href="#report" data-page="report"><span class="icon document" aria-hidden="true"></span><span data-copy="report"></span></a>
        <a href="#evaluation" data-page="evaluation"><span class="icon chart" aria-hidden="true"></span><span data-copy="evaluation"></span></a>
      </nav>
      <div class="side-bottom">
        <span class="source-status"><i></i><span data-copy="editLocal"></span></span>
        <a id="sidebar-source" href="https://github.com/microsoft/PowerToys/issues" target="_blank" rel="noopener noreferrer">PowerToys Issues <span aria-hidden="true">↗</span></a>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div class="breadcrumbs"><span data-copy="workspace"></span><span class="crumb" aria-hidden="true">/</span><span id="breadcrumb"></span></div>
        <div class="top-actions">
          <div class="language-toggle" id="language-toggle" role="group">
            <button type="button" data-language="zh" lang="zh-CN" aria-label="中文">中文</button>
            <button type="button" data-language="en" lang="en" aria-label="English">EN</button>
          </div>
          <button id="import" class="button small secondary"><span aria-hidden="true">⇧</span><span data-copy="intake"></span></button>
        </div>
        <input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>
      </div>
      <div id="workspace" class="content" aria-busy="true"><p class="loading" data-copy="loading">正在载入反馈工作区…</p></div>
    </main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
